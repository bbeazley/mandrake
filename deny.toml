# cargo-deny configuration.
# Run through scripts/check-deps.sh (ci-gate.sh step 0), fully offline:
#   nix develop -c ./scripts/check-deps.sh
# Our code is MIT OR Apache-2.0. Dependencies must use permissive licences only.

[graph]
# Every target (Linux, Windows, macOS, Android, wasm32): the licence and source rules hold for
# every platform we might ship on.
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
# The RustSec database pinned in flake.lock (input `advisory-db`). scripts/check-deps.sh turns
# the read-only nix store copy into the git checkout cargo-deny expects under this path; cargo
# deny runs with --offline, so it never fetches. Update the database with
#   nix flake update advisory-db && git add flake.lock
# and commit it with any advisory follow-ups.
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# The pinned database ages between updates; that must not turn the overnight gate red on its own.
# Update it (above) at least monthly instead.
maximum-db-staleness = "P3650D"
# Unmaintained crates are reported for our direct dependencies only; transitive ones come from
# upstream crates (wgpu, winit, cpal) that we can't change here.
unmaintained = "workspace"
# Each ignored advisory needs a reason and a follow-up.
ignore = []

[licenses]
version = 2
# Permissive licences only. Anything else, including MPL-2.0, LGPL and GPL, is denied unless the
# developer approves a specific crate as an exception below, with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.93
# Developer-approved exceptions only: { allow = ["<SPDX>"], crate = "<name>" } plus a comment
# giving the reason and the approval.
exceptions = []

[licenses.private]
# Our own crates are covered by [workspace.package] license and are not published.
ignore = true

[bans]
multiple-versions = "warn"
# Path dependencies between our workspace crates have no version requirement; scripts/check-deps.sh
# rejects wildcard requirements on third-party crates instead.
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "binrw", reason = "one binary-parsing crate: byteorder" },
    { crate = "openssl", reason = "native TLS stack with a system dependency; use rustls if TLS is ever needed" },
    { crate = "openssl-sys", reason = "native TLS stack with a system dependency; use rustls if TLS is ever needed" },
]

[sources]
# crates.io only: no other registries, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
