[package]
name = "mandrake-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "mandrake"
path = "src/main.rs"

[dependencies]
mandrake-common.workspace = true
mandrake-math.workspace = true
mandrake-tag.workspace = true
mandrake-rec.workspace = true
mandrake-session.workspace = true
mandrake-net.workspace = true
mandrake-sim.workspace = true
mandrake-tfl-sim.workspace = true
mandrake-render.workspace = true
mandrake-view.workspace = true
mandrake-audio.workspace = true
mandrake-dialogs.workspace = true
mandrake-smacker.workspace = true
winit.workspace = true
wgpu.workspace = true
image.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
pollster = "1.0.1"
toml_edit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Window",
    "console",
] }
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_16"] }
ureq = { version = "3.4", default-features = false }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
rav1d = { version = "1.1", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
