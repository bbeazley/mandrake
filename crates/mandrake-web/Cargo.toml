[package]
name = "mandrake-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mandrake-common.workspace = true
mandrake-tag.workspace = true
mandrake-rec.workspace = true
mandrake-sim.workspace = true

# The game itself, for the browser only: natively mandrake-client is its own binary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mandrake-client = { path = "../mandrake-client" }
# Only the wasm32 modules use it (lib.rs); natively cargo 1.100 calls it unused.
wasm-bindgen = "0.2"
